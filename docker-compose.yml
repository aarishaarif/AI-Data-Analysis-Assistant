services:
  api:
    build: ./fastapi
    image: ${API_IMAGE:-insightflow-api:local}
    ports:
      - "8000:8000"
    volumes:
      - insightflow-data:/app/data
    environment:
      FRONTEND_ORIGINS: http://localhost:8080,http://localhost:5173
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    image: ${FRONTEND_IMAGE:-insightflow-frontend:local}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  insightflow-data:
